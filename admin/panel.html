<input id="name">
<button onclick="add()">إضافة خدمة</button>

<div id="list"></div>

<script type="module">
import { db } from "../js/firebase.js";
import { addDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

window.add = async ()=>{
  await addDoc(collection(db,"services"), {name:name.value});
  alert("تمت الإضافة");
};

getDocs(collection(db,"services")).then(d=>{
  d.forEach(doc=>{
    list.innerHTML += `<p>${doc.data().name}</p>`;
  });
});
</script>
